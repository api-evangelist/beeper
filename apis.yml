aid: beeper
name: Beeper
description: >-
  Beeper is a universal chat app that brings 12+ messaging networks — WhatsApp, Instagram,
  Telegram, Signal, Messenger, X, Google Messages, Google Chat, Google Voice, LinkedIn,
  Discord and Slack — into a single unified inbox across macOS, Windows, Linux, iOS and
  Android. Built on the Matrix protocol and owned by Automattic, Beeper connects to networks
  on-device for privacy. For developers Beeper ships the Beeper Desktop API: a local-first
  REST API and built-in Model Context Protocol (MCP) server that runs entirely on the user's
  machine, letting agents and apps search chats, read and send messages, react, manage
  reminders and control the app. Official SDKs are published for JavaScript, Python, Go and
  PHP, alongside bridges for self-hosting and Android intents/content-providers.
