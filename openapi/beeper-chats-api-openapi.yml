            invite:
              $ref: '#/components/schemas/CapabilitySupportLevel'
            kick:
              $ref: '#/components/schemas/CapabilitySupportLevel'
            leave:
              $ref: '#/components/schemas/CapabilitySupportLevel'
            revokeInvite:
              $ref: '#/components/schemas/CapabilitySupportLevel'
          description: Participant management capabilities.
        state:
          $ref: '#/components/schemas/ChatStateCapabilities'
      description: Chat capabilities reported by the platform.
    StartChatInput:
      type: object
      properties:
        accountID:
          type: string
          description: Account to create or start the chat on.
        messageText:
          type: string
          description: Optional first message content if the platform requires it to create the chat.
        user:
          type: object
          properties:
            id:
              type: string
              description: Known user ID when available.
            username:
              type: string
              description: Username/handle candidate.
            phoneNumber:
              type: string
              description: Phone number candidate (E.164 preferred).
            email:
              type: string
              description: Email candidate.
            fullName:
              type: string
              description: Display name hint used for ranking only.
          description: Merged user-like contact payload used to resolve the best identifier.
        allowInvite:
          type: boolean
          default: true
          description: Whether invite-based DM creation is allowed when required by the platform.
      required:
      - accountID
      - user
      description: Start a direct chat from a user/contact payload. Available in Beeper Desktop v4.2.808+.
      x-beeper-available-since: Beeper Desktop v4.2.808+
    MessageTextInput:
      type: string
      description: Draft text. Plain text and Markdown are converted to Matrix HTML with the same rules used by send and edit.
    ChatWithPreview:
      allOf:
      - $ref: '#/components/schemas/Chat'
      - type: object
        properties:
          preview:
            allOf:
            - $ref: '#/components/schemas/Message'
            - description: Last message preview for this chat, if available.
      description: Chat with optional last message preview.
      example:
        id: '!whatsapp_15550101002:ba_EvYDBBsZbRQAy3UOSWqG0LuTVkc.local-whatsapp.localhost'
        localChatID: '5639'
        accountID: local-whatsapp_ba_EvYDBBsZbRQAy3UOSWqG0LuTVkc
        network: WhatsApp
        title: Kishan Bagaria
        type: single
        participants:
          items:
          - id: '@15550101002:local-whatsapp.localhost'
            phoneNumber: '+15550101002'
            fullName: Kishan Bagaria
            cannotMessage: false
            isSelf: false
          - id: '@ba_EvYDBBsZbRQAy3UOSWqG0LuTVkc:local-whatsapp.localhost'
            fullName: Batuhan İçöz
            cannotMessage: false
            isSelf: true
          hasMore: false
          total: 2
        lastActivity: '2026-05-05T20:11:54.000Z'
        unreadCount: 0
        lastReadMessageSortKey: '455171049984'
        draft: null
        isArchived: false
        isMuted: false
        isPinned: false
    DraftAttachment:
      type: object
      properties:
        id:
          type: string
          description: Draft attachment identifier.
        type:
          type: string
          enum:
          - file
          - gif
          - recorded_audio
          description: Draft attachment type. GIF and recorded audio are mutually exclusive types.
        mimeType:
          type: string
          description: MIME type if known.
        fileName:
          type: string
          description: Original filename if available.
        filePath:
          type: string
          description: Local filesystem path for the draft attachment.
        fileSize:
          type: number
          description: File size in bytes if known.
        stickerID:
          type: string
          description: Sticker identifier if the draft attachment is a sticker.
        audioDurationSeconds:
          type: number
          description: Audio duration in seconds if known.
        size:
          type: object
          properties:
            width:
              type: number
            height:
              type: number
          description: Pixel dimensions of the attachment.
      required:
      - id
      - type
    MessageAttachmentInput:
      type: object
      properties:
        uploadID:
          type: string
          description: Upload ID from uploadAsset endpoint. Required to reference uploaded files.
        mimeType:
          type: string
          description: MIME type (optional override of cached value)
        fileName:
          type: string
          description: Filename (optional override of cached value)
        size:
          type: object
          properties:
            width:
              type: number
            height:
              type: number
          required:
          - width
          - height
          description: Dimensions (optional override of cached value)
        duration:
          type: number
          description: Duration in seconds (optional override of cached value)
        type:
          $ref: '#/components/schemas/MessageAttachmentType'
      required:
      - uploadID
    Attachment:
      type: object
      properties:
        id:
          type: string
          description: Attachment identifier (typically an mxc:// URL). Use the download file endpoint to get a local file path.
        type:
          type: string
          enum:
          - unknown
          - img
          - video
          - audio
          description: Attachment type.
        srcURL:
          type: string
          description: Public URL or local file path to fetch the file. May be temporary or local-only to this device; download promptly if durable access is needed.
        mimeType:
          type: string
          description: MIME type if known (e.g., 'image/png').
        fileName:
          type: string
          description: Original filename if available.
        fileSize:
          type: number
          description: File size in bytes if known.
        isGif:
          type: boolean
          description: True if the attachment is a GIF.
        isSticker:
          type: boolean
          description: True if the attachment is a sticker.
        isVoiceNote:
          type: boolean
          description: True if the attachment is a voice note.
        duration:
          type: number
          description: Duration in seconds (audio/video).
        transcription:
          $ref: '#/components/schemas/Transcription'
        posterImg:
          type: string
          description: Preview image URL for video attachments (poster frame). May be temporary or local-only to this device; download promptly if durable access is needed.
        size:
          type: object
          properties:
            width:
              type: number
            height:
              type: number
          description: 'Pixel dimensions of the attachment: width/height in px.'
      required:
      - type
    CreateChatInput:
      type: object
      properties:
        accountID:
          type: string
          description: Account to create or start the chat on.
        messageText:
          type: string
          description: Optional first message content if the platform requires it to create the chat.
        type:
          type: string
          enum:
          - single
          - group
          description: '''single'' requires exactly one participantID; ''group'' supports multiple participants and optional title.'
        participantIDs:
          type: array
          items:
            type: string
          minItems: 1
          description: User IDs to include in the new chat.
        title:
          type: string
          description: Optional title for group chats; ignored for single chats on most networks.
      required:
      - accountID
      - type
      - participantIDs
    MessageAttachmentType:
      type: string
      enum:
      - image
      - video
      - audio
      - file
      - gif
      - voice-note
      - sticker
      description: Attachment type hint (image, video, audio, file, gif, voice-note, sticker). If omitted, auto-detected from mimeType
    Transcription:
      type: object
      properties:
        transcription:
          type: string
          description: Transcribed text.
        engine:
          type: string
          description: Transcription engine.
        language:
          type: string
          description: Detected or selected language.
      required:
      - transcription
      - engine
      description: Attachment transcription if available.
    ListChatsOutput:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChatWithPreview'
          description: Chats ordered by last activity timestamp (most recent first).
          x-stainless-pagination-property:
            purpose: items
        hasMore:
          type: boolean
          description: True if additional results can be fetched using the provided cursors.
          x-stainless-pagination-property:
            purpose: has_next_page
        oldestCursor:
          type: string
          nullable: true
          description: Cursor for fetching older results (use with direction='before'). Opaque string; do not inspect.
          example: '1725489123456'
          x-stainless-pagination-property:
            purpose: next_cursor_field
        newestCursor:
          type: string
          nullable: true
          description: Cursor for fetching newer results (use with direction='after'). Opaque string; do not inspect.
          example: '1725489123456'
      required:
      - items
      - hasMore
      - oldestCursor
      - newestCursor
    Reaction:
      type: object
      properties:
        id:
          type: string
          description: Reaction ID. When a participant can react more than once, the ID is the participant ID concatenated with the reaction key; otherwise it equals the participant ID.
        reactionKey:
          type: string
          description: 'The reaction key: an emoji (😄), a network-specific key, or a shortcode like "smiling-face".'
        imgURL:
          type: string
          description: URL to the reaction's image. May be temporary or local-only to this device; download promptly if durable access is needed.
        participantID:
          type: string
          description: User ID of the participant who reacted.
        emoji:
          type: boolean
          description: True if the reactionKey is an emoji.
      required:
      - id
      - reactionKey
      - participantID
    ChatDraft:
      type: object
      nullable: true
      properties:
        text:
          type: string
          description: Matrix HTML draft body.
        attachments:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/DraftAttachment'
          description: Draft attachments keyed by attachment ID.
      required:
      - text
      description: Current draft object for this chat, or null when no draft is set.
    Participant:
      allOf:
      - $ref: '#/components/schemas/User'
      - type: object
        properties:
          isAdmin:
            type: boolean
            description: True if this participant has admin privileges in the chat.
          isPending:
            type: boolean
            description: True if this participant has been invited but has not joined yet.
          isNetworkBot:
            type: boolean
            description: True if this participant represents a network or bridge bot.
      description: A chat participant. Extends User with chat membership metadata.
    CapabilitySupportLevel:
      type: integer
      enum:
      - -2
      - -1
      - 0
      - 1
      - 2
      description: '-2: rejected, -1: dropped, 0: unsupported, 1: partially supported, 2: fully supported.'
  responses:
    UnauthorizedError:
      description: Access token is missing or invalid
      headers:
        X-Beeper-Desktop-Version:
          $ref: '#/components/headers/X-Beeper-Desktop-Version'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalServerError:
      description: Internal server error
      headers:
        X-Beeper-Desktop-Version:
          $ref: '#/components/headers/X-Beeper-Desktop-Version'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      headers:
        X-Beeper-Desktop-Version:
          $ref: '#/components/headers/X-Beeper-Desktop-Version'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Too many requests - rate limit exceeded
      headers:
        X-Beeper-Desktop-Version:
          $ref: '#/components/headers/X-Beeper-Desktop-Version'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    BadRequest:
      description: Invalid request parameters
      headers:
        X-Beeper-Desktop-Version:
          $ref: '#/components/headers/X-Beeper-Desktop-Version'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UnprocessableEntity:
      description: Unprocessable entity - validation error
      headers:
        X-Beeper-Desktop-Version:
          $ref: '#/components/headers/X-Beeper-Desktop-Version'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ForbiddenError:
      description: Access token does not have the required scope
      headers:
        X-Beeper-Desktop-Version:
          $ref: '#/components/headers/X-Beeper-Desktop-Version'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  headers:
    X-Beeper-Desktop-Version:
      description: Beeper Desktop application version providing this response.
      schema:
        type: string
        example: 4.0.0
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Bearer token authentication. Access token obtained via OAuth2 PKCE flow or created in-app. Required for all API operations.
    oauth2:
      type: oauth2
      description: OAuth2 Authorization Code flow with PKCE for obtaining bearer access tokens. Used by MCP servers to authenticate clients.
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:23373/oauth/authorize
          tokenUrl: http://localhost:23373/oauth/token
          scopes:
            read: Read access to messages, chats, and accounts
            write: Write access to send messages, edit messages, react to messages, archive chats, and set reminders
externalDocs:
  description: Beeper Desktop API Documentation
  url: https://developers.beeper.com/desktop-api
