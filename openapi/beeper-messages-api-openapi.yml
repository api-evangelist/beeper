            fullName: Kishan Bagaria
            cannotMessage: false
            isSelf: false
          - id: '@ba_EvYDBBsZbRQAy3UOSWqG0LuTVkc:local-whatsapp.localhost'
            fullName: Batuhan İçöz
            cannotMessage: false
            isSelf: true
          hasMore: false
          total: 2
