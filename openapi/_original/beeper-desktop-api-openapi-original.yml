  "tags": [
    {
      "name": "App",
      "description": "Top-level actions: focus the app window, jump to a chat, or run unified search across chats and messages."
    },
    {
      "name": "Server",
      "description": "Server discovery and capability metadata. Use /v1/info before authentication setup."
    },
    {
      "name": "Accounts",
      "description": "Chat Accounts connected to this Beeper Desktop instance. Each Account owns a bridge and network."
    },
    {
      "name": "Contacts",
      "description": "Per-account address book and network lookup. The same person can appear under multiple Accounts."
    },
    {
      "name": "Chats",
      "description": "Chats, reminders, read state, archive state, priority, mute, and other conversation metadata."
    },
    {
      "name": "Messages",
      "description": "Messages inside a Chat: list, search, send, retrieve, edit, delete, and react."
    },
    {
      "name": "Files",
      "description": "File upload, download, and streaming helpers for message attachments and drafts."
    },
    {
      "name": "OAuth",
      "description": "OAuth2 Authorization Code with PKCE. SDK code is not generated for these endpoints; call them directly.\n\nFlow: register a public client with POST /oauth/register, send the user to GET /oauth/authorize, then exchange the returned code with POST /oauth/token. Use the returned access token as Authorization: Bearer on every other endpoint.\n\nNotes: PKCE S256 only. No refresh tokens; re-prompt at expires_in. /oauth/token, /oauth/introspect, and /oauth/revoke are documented as application/x-www-form-urlencoded per OAuth RFCs. JSON bodies are accepted by Beeper Desktop as compatibility affordances but are not the public contract. Scopes are read and write."
    }
  ],
  "externalDocs": {
    "description": "Beeper Desktop API Documentation",
    "url": "https://developers.beeper.com/desktop-api"
  },
